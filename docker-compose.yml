# UNTESTED: the build environment had no Docker daemon (see BLOCKERS.md B-D1).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    ports:
      - "8000:8000"
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
