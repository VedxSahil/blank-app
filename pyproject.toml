[project]
name = "pereport"
version = "0.1.0"
description = "PEReport: fund document assistant (RAG with citations, verifier and refusals)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pymupdf", "fastapi", "uvicorn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx"]
models = ["sentence-transformers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["pereport", "tests"]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pereport.ingest", "test_ingest"]
disallow_untyped_calls = false
